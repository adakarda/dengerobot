; Robot ESP32 (ESP32-WROOM-32D gelistirme karti)
; VS Code + PlatformIO eklentisiyle bu klasoru acip "Upload" deyin.
; Kod yuklerken ana karttaki JP1 koprusunu cikarin (USB ve LM2596 5 V'u cakismasin).

[platformio]
default_envs = robot

[env:robot]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../../common
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
