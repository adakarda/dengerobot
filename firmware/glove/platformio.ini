; Eldiven: ESP32-C3 Super Mini + MPU6050 + 1S LiPo
; Kod yuklerken eldivendeki SW1'i kapatin (C3 Mini'de USB ile 5V pini arasinda diyot yok).

[platformio]
default_envs = glove

[env:glove]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../common
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
