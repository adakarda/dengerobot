; Donanim test yazilimi (breadboard dogrulamasi). Denge kodu icermez.
; pio run -d firmware/bench -t upload --upload-port COMx
[platformio]
default_envs = bench

[env:bench]
platform = espressif32@6.9.0          ; robot ile ayni (Arduino-ESP32 2.0.17)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_extra_dirs = ../../common
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -I../robot/src
  -I../../common/cdtp_core/src
